<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nexa AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --orange:#FF6B00;
    --orange-light:#FF8C3A;
    --orange-dark:#CC4A00;
    --orange-glow:#FF6B0055;
    --orange-subtle:#FF6B0015;
    --bg:#0A0500;
    --bg2:#100800;
    --bg3:#160C00;
    --text:#FFF0E0;
    --text-dim:#AA8866;
    --card:#1A0E00;
    --border:#FF6B0033;
  }

  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:'Rajdhani',sans-serif;}

  /* ── PARTICLES BG ── */
  #particles{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .particle{
    position:absolute;width:2px;height:2px;background:var(--orange);
    border-radius:50%;opacity:0;animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(100vh) scale(0);}
    10%{opacity:.6;}
    90%{opacity:.2;}
    100%{opacity:0;transform:translateY(-10vh) scale(1.5);}
  }

  /* ── WELCOME SCREEN ── */
  #welcome{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#200D0000 0%,#0A0500 70%);
  }
  .welcome-card{
    background:linear-gradient(145deg,#1A0E00,#120900);
    border:1px solid var(--orange);
    border-radius:20px;
    padding:48px 44px;
    max-width:440px;width:90%;
    box-shadow:0 0 60px var(--orange-glow),0 0 120px #FF6B0022,inset 0 1px 0 #FF6B0033;
    position:relative;overflow:hidden;
    animation:cardIn .8s cubic-bezier(.175,.885,.32,1.275) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(40px) scale(.92);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .welcome-card::before{
    content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);
    width:200px;height:200px;
    background:radial-gradient(circle,var(--orange-glow) 0%,transparent 70%);
    pointer-events:none;
  }

  .logo-area{text-align:center;margin-bottom:32px;}
  .logo-orb{
    width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#FF8C3A,#CC4A00,#660000);
    margin:0 auto 16px;
    box-shadow:0 0 30px var(--orange),0 0 60px var(--orange-glow);
    animation:pulseOrb 2s ease-in-out infinite;
    display:flex;align-items:center;justify-content:center;
    font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;color:#fff;
    text-shadow:0 0 10px #fff;
  }
  @keyframes pulseOrb{
    0%,100%{box-shadow:0 0 30px var(--orange),0 0 60px var(--orange-glow);}
    50%{box-shadow:0 0 50px var(--orange),0 0 100px var(--orange-glow),0 0 140px #FF6B0011;}
  }
  .logo-title{
    font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;
    color:var(--orange);letter-spacing:4px;
    text-shadow:0 0 20px var(--orange),0 0 40px var(--orange-glow);
  }
  .logo-sub{font-size:13px;color:var(--text-dim);letter-spacing:6px;margin-top:4px;text-transform:uppercase;}

  .divider{height:1px;background:linear-gradient(to right,transparent,var(--orange),transparent);margin:28px 0;}

  .welcome-label{font-size:14px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
  .welcome-input{
    width:100%;padding:14px 18px;
    background:#0F0600;
    border:1px solid var(--orange);border-radius:10px;
    color:var(--text);font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:600;
    outline:none;transition:.3s;letter-spacing:1px;
  }
  .welcome-input:focus{border-color:var(--orange-light);box-shadow:0 0 0 3px var(--orange-glow);}
  .welcome-input::placeholder{color:#553322;}

  .welcome-btn{
    width:100%;margin-top:20px;padding:16px;
    background:linear-gradient(135deg,var(--orange),var(--orange-dark));
    border:none;border-radius:10px;cursor:pointer;
    font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;
    color:#fff;letter-spacing:3px;text-transform:uppercase;
    box-shadow:0 4px 20px var(--orange-glow);
    transition:.25s;position:relative;overflow:hidden;
  }
  .welcome-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--orange-glow);}
  .welcome-btn:active{transform:translateY(0);}
  .welcome-btn::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,#fff2,transparent);
    pointer-events:none;
  }

  /* ── MAIN CHAT ── */
  #app{
    position:fixed;inset:0;z-index:10;
    display:none;flex-direction:column;
  }

  /* HEADER */
  .header{
    display:flex;align-items:center;gap:14px;
    padding:12px 20px;
    background:linear-gradient(to bottom,#160C00,#0F0700);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 20px #FF6B0022;flex-shrink:0;
  }
  .header-avatar{
    width:44px;height:44px;border-radius:50%;overflow:hidden;
    border:2px solid var(--orange);
    box-shadow:0 0 14px var(--orange-glow);flex-shrink:0;
  }
  .header-avatar img{width:100%;height:100%;object-fit:cover;}
  .header-info{flex:1;}
  .header-name{
    font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;
    color:var(--orange);letter-spacing:2px;
    text-shadow:0 0 10px var(--orange-glow);
  }
  .header-status{display:flex;align-items:center;gap:6px;margin-top:2px;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#00FF88;box-shadow:0 0 6px #00FF88;animation:blink 1.5s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  .status-text{font-size:11px;color:#00FF88;letter-spacing:1px;}
  .header-user{font-size:12px;color:var(--text-dim);letter-spacing:1px;}

  /* SIDEBAR AVATAR */
  .sidebar{
    position:absolute;right:0;top:68px;bottom:60px;width:180px;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:.18;
    overflow:hidden;
  }
  .sidebar img{width:100%;height:100%;object-fit:cover;object-position:top center;}

  /* MESSAGES */
  .messages{
    flex:1;overflow-y:auto;padding:16px 20px;
    scrollbar-width:thin;scrollbar-color:var(--orange-dark) transparent;
    position:relative;
  }
  .messages::-webkit-scrollbar{width:4px;}
  .messages::-webkit-scrollbar-thumb{background:var(--orange-dark);border-radius:2px;}

  .msg-row{display:flex;gap:10px;margin-bottom:16px;animation:msgIn .3s ease both;}
  @keyframes msgIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .msg-row.user{flex-direction:row-reverse;}

  .msg-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;border:1.5px solid var(--orange);box-shadow:0 0 8px var(--orange-glow);}
  .msg-avatar img{width:100%;height:100%;object-fit:cover;}
  .msg-avatar.user-av{background:linear-gradient(135deg,var(--orange),var(--orange-dark));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;font-family:'Orbitron',sans-serif;}

  .msg-bubble{
    max-width:72%;padding:12px 16px;border-radius:16px;
    font-size:15px;line-height:1.6;color:var(--text);font-weight:500;
  }
  .msg-row:not(.user) .msg-bubble{
    background:linear-gradient(135deg,#1E1000,#150A00);
    border:1px solid var(--border);border-top-left-radius:4px;
    box-shadow:0 2px 12px #FF6B0011;
  }
  .msg-row.user .msg-bubble{
    background:linear-gradient(135deg,var(--orange-dark),#882200);
    border:1px solid var(--orange);border-top-right-radius:4px;
    box-shadow:0 2px 12px var(--orange-glow);color:#fff;
  }

  .msg-time{font-size:10px;color:var(--text-dim);margin-top:4px;text-align:right;letter-spacing:.5px;}
  .msg-row:not(.user) .msg-time{text-align:left;}

  /* TYPING */
  .typing-bubble{background:linear-gradient(135deg,#1E1000,#150A00);border:1px solid var(--border);border-top-left-radius:4px;padding:14px 18px;border-radius:16px;}
  .typing-dots{display:flex;gap:5px;align-items:center;}
  .typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:dot 1.2s infinite;}
  .typing-dots span:nth-child(2){animation-delay:.2s;}
  .typing-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}

  /* INPUT BAR */
  .input-bar{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;
    background:linear-gradient(to top,#160C00,#0F0700);
    border-top:1px solid var(--border);flex-shrink:0;
  }
  .input-field{
    flex:1;padding:12px 16px;
    background:#0F0600;border:1px solid var(--border);border-radius:24px;
    color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:500;
    outline:none;transition:.25s;resize:none;max-height:100px;
    scrollbar-width:none;
  }
  .input-field:focus{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-glow);}
  .input-field::placeholder{color:#553322;}

  .send-btn{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,var(--orange),var(--orange-dark));
    border:none;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px var(--orange-glow);transition:.2s;
  }
  .send-btn:hover{transform:scale(1.1);box-shadow:0 0 24px var(--orange);}
  .send-btn:active{transform:scale(.95);}
  .send-btn svg{width:20px;height:20px;fill:#fff;}

  /* WELCOME MSG */
  .welcome-msg-card{
    background:linear-gradient(135deg,#1E1000,#150A00);
    border:1px solid var(--orange);border-radius:16px;
    padding:20px;margin-bottom:20px;
    box-shadow:0 0 30px var(--orange-glow);
    animation:msgIn .5s ease both;
  }
  .nexa-img-hero{
    width:100%;max-height:220px;object-fit:cover;object-position:top center;
    border-radius:10px;margin-bottom:14px;border:1px solid var(--border);
  }
  .nexa-greeting{font-size:15px;color:var(--text);line-height:1.7;}
  .nexa-greeting strong{color:var(--orange);font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:1px;}

  /* SLIDE-IN ANIM */
  @keyframes slideIn{
    from{opacity:0;transform:translateX(30px);}
    to{opacity:1;transform:translateX(0);}
  }
</style>
</head>
<body>

<!-- PARTICLES -->
<div id="particles"></div>

<!-- ═══════════════════════════════════ WELCOME SCREEN ═══ -->
<div id="welcome">
  <div class="welcome-card">
    <div class="logo-area">
      <div class="logo-orb">N</div>
      <div class="logo-title">NEXA AI</div>
      <div class="logo-sub">Next Generation Intelligence</div>
    </div>
    <div class="divider"></div>
    <div class="welcome-label">Siapa namamu?</div>
    <input class="welcome-input" id="nameInput" type="text" placeholder="Masukkan namamu..." maxlength="32" autocomplete="off"/>
    <button class="welcome-btn" id="enterBtn" onclick="enterChat()">
      ⚡ &nbsp;MULAI CHAT
    </button>
  </div>
</div>

<!-- ═══════════════════════════════════ CHAT APP ═══════════ -->
<div id="app">
  <div class="header">
    <div class="header-avatar">
      <img id="headerImg" src="" alt="Nexa"/>
    </div>
    <div class="header-info">
      <div class="header-name">NEXA AI</div>
      <div class="header-status">
        <div class="status-dot"></div>
        <span class="status-text">Online · Aktif</span>
      </div>
    </div>
    <div class="header-user" id="headerUser"></div>
  </div>

  <!-- ghost sidebar image -->
  <div class="sidebar"><img id="sidebarImg" src="" alt=""/></div>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <textarea class="input-field" id="inputField" placeholder="Ketik pesanmu..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
